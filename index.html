<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Check-in Yoga</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #b57cff, #00e0ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

.titulo {
    font-size: 22px;
    font-weight: bold;
}

.sub {
    color: #666;
    margin-bottom: 15px;
}

input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #7b2cff, #00cfff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.admin {
    margin-top: 15px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="titulo" id="nomeAula">Carregando...</div>
    <div class="sub" id="profAula"></div>

    <input type="text" id="nome" placeholder="Digite seu nome">

    <select id="plano">
        <option value="7.38">TotalPass</option>
        <option value="7.34">Gympass</option>
        <option value="mensal">Mensal</option>
    </select>

    <button onclick="checkin()">Confirmar presença</button>

    <p id="msg"></p>

    <div class="admin">
        <input type="password" id="senha" placeholder="Admin">
        <button onclick="verAdmin()">Ver relatório</button>
        <p id="relatorio"></p>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAatjvibYj9oB0rLzgL-iQINqZmee-leHA",
  authDomain: "movomyoga.firebaseapp.com",
  databaseURL: "https://movomyoga-default-rtdb.firebaseio.com",
  projectId: "movomyoga",
  storageBucket: "movomyoga.firebasestorage.app",
  messagingSenderId: "554585738197",
  appId: "1:554585738197:web:e568518ec311c69792cb5c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== GRADE =====
const grade = {
    1: [
        {hora: "09:30", aula: "Yoga Integrativa", prof: "Jorginho"},
        {hora: "17:20", aula: "Yoga Integrativa", prof: "Felipe"},
        {hora: "18:30", aula: "Yoga Integrativa", prof: "Felipe"}
    ],
    2: [
        {hora: "07:00", aula: "Yoga Integrativa", prof: "Jorginho"},
        {hora: "09:30", aula: "Yoga Sutil", prof: "Jorginho"},
        {hora: "17:00", aula: "Funcional", prof: "Alessandra"}
    ],
    3: [
        {hora: "08:00", aula: "Aéreo Yoga", prof: "Alessandra"},
        {hora: "09:30", aula: "Yoga Integrativa", prof: "Alessandra"},
        {hora: "17:20", aula: "Yoga Integrativa", prof: "Felipe"}
    ],
    4: [
        {hora: "09:30", aula: "Yoga Sutil", prof: "Alessandra"},
        {hora: "17:20", aula: "Yoga Integrativa", prof: "Jorginho"},
        {hora: "18:30", aula: "Yoga Integrativa", prof: "Jorginho"}
    ],
    5: [
        {hora: "08:15", aula: "Aéreo Yoga", prof: "Alessandra"},
        {hora: "09:30", aula: "Chair Yoga", prof: "Alessandra"},
        {hora: "17:20", aula: "Yoga Integrativa", prof: "Felipe"}
    ],
    6: [
        {hora: "08:30", aula: "Oficina de Asanas", prof: "Jorginho/Felipe"},
        {hora: "10:30", aula: "Vinyasa", prof: "Jorginho/Felipe"}
    ]
};

// ===== DETECTAR AULA =====
function getAulaAtual() {
    const now = new Date();
    const dia = now.getDay();
    const horaAtual = now.getHours()*60 + now.getMinutes();

    let aulasHoje = grade[dia] || [];

    for (let a of aulasHoje) {
        let [h, m] = a.hora.split(":");
        let horaAula = parseInt(h)*60 + parseInt(m);

        if (horaAtual >= horaAula && horaAtual <= horaAula + 40) {
            return a;
        }
    }
    return null;
}

// ===== MOSTRAR =====
function mostrarAula() {
    let aula = getAulaAtual();

    if (aula) {
        document.getElementById("nomeAula").innerText = aula.aula;
        document.getElementById("profAula").innerText =
            "Prof: " + aula.prof + " • " + aula.hora;
    } else {
        document.getElementById("nomeAula").innerText = "Nenhuma aula agora";
    }
}
mostrarAula();

// ===== CHECK-IN FIREBASE =====
window.checkin = function() {
    let nome = document.getElementById("nome").value;
    let plano = document.getElementById("plano").value;
    let aula = getAulaAtual();

    if (!nome || !aula) {
        alert("Preencha seu nome ou aguarde o horário!");
        return;
    }

    push(ref(db, "checkins"), {
        nome: nome,
        plano: plano,
        valor: plano === "mensal" ? 0 : parseFloat(plano),
        prof: aula.prof,
        data: new Date().toLocaleString()
    });

    document.getElementById("msg").innerText = "✅ Check-in realizado!";
    document.getElementById("nome").value = "";
}

// ===== RELATÓRIO EM TEMPO REAL =====
window.verAdmin = function() {
    let senha = document.getElementById("senha").value;

    if (senha !== "1234") {
        alert("Senha incorreta");
        return;
    }

    onValue(ref(db, "checkins"), snapshot => {
        let dados = snapshot.val();
        let total = 0;
        let professores = {};

        for (let id in dados) {
            let r = dados[id];
            total += r.valor;

            let lista = r.prof.split("/");
            let valorDiv = r.valor / lista.length;

            lista.forEach(p => {
                p = p.trim();
                if (!professores[p]) professores[p] = 0;
                professores[p] += valorDiv;
            });
        }

        let texto = `💰 <b>Total:</b> R$ ${total.toFixed(2)}<br><br>`;

        for (let p in professores) {
            texto += `👤 ${p}: R$ ${professores[p].toFixed(2)}<br>`;
        }

        document.getElementById("relatorio").innerHTML = texto;
    });
}
</script>

</body>
</html>
